[project]
name = "deterministic-quantitative-routing"
version = "1.0.0"
description = "Thin-agent, fat-platform routing of natural-language queries to frozen, stateless quantitative regime functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pandas",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
# An application, not a library: the code is imported as `src.*` from the repository root.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/mutation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
